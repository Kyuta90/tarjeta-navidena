<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Snow particles -->
  <circle cx="60" cy="80" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="120" cy="50" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="330" cy="90" r="4" fill="#ffffff" opacity="0.7"/>
  <circle cx="350" cy="160" r="2.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="40" cy="220" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="360" cy="300" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="70" cy="340" r="3" fill="#ffffff" opacity="0.7"/>
  
  <!-- Gift Box Shadow -->
  <ellipse cx="200" cy="345" rx="110" ry="18" fill="#000000" opacity="0.5" />
  
  <!-- Main Gift Box Body -->
  <rect x="110" y="190" width="180" height="135" rx="8" fill="url(#boxGrad)" stroke="#7f1d1d" stroke-width="2"/>
  
  <!-- Vertical Ribbon on Body -->
  <rect x="180" y="190" width="40" height="135" fill="url(#ribbonGrad)"/>
  <line x1="180" y1="190" x2="180" y2="325" stroke="#b45309" stroke-width="2" />
  <line x1="220" y1="190" x2="220" y2="325" stroke="#b45309" stroke-width="2" />
  
  <!-- Gift Box Lid -->
  <rect x="95" y="150" width="210" height="45" rx="6" fill="url(#boxGrad)" stroke="#7f1d1d" stroke-width="2"/>
  <!-- Vertical Ribbon on Lid -->
  <rect x="180" y="150" width="40" height="45" fill="url(#ribbonGrad)"/>
  <line x1="180" y1="150" x2="180" y2="195" stroke="#b45309" stroke-width="2" />
  <line x1="220" y1="150" x2="220" y2="195" stroke="#b45309" stroke-width="2" />
  
  <!-- Ribbon Bow Top -->
  <!-- Left loop -->
  <path d="M 195 150 C 140 100, 120 120, 175 145 Z" fill="url(#ribbonGrad)" stroke="#b45309" stroke-width="2" filter="url(#glow)"/>
  <!-- Right loop -->
  <path d="M 205 150 C 260 100, 280 120, 225 145 Z" fill="url(#ribbonGrad)" stroke="#b45309" stroke-width="2" filter="url(#glow)"/>
  <!-- Ribbon Center Knot -->
  <circle cx="200" cy="148" r="14" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  
  <!-- Sparkles -->
  <path d="M 130 110 Q 130 125 115 125 Q 130 125 130 140 Q 130 125 145 125 Q 130 125 130 110" fill="#fde68a"/>
  <path d="M 280 100 Q 280 112 268 112 Q 280 112 280 124 Q 280 112 292 112 Q 280 112 280 100" fill="#fde68a"/>
  <path d="M 290 260 Q 290 270 280 270 Q 290 270 290 280 Q 290 270 300 270 Q 290 270 290 260" fill="#fde68a"/>

  <!-- Text -->
  <text x="200" y="380" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="1">
    REGALO DE NAVIDAD
  </text>
</svg>
